name: "Benchmark: Event publication and delivery"

on:
  workflow_dispatch:
    inputs:
      agents:
        description: 'Total agents (2–16); each publishes to every agent on this host'
        type: string
        default: '2'
        required: true
      duration_seconds:
        description: 'Publication duration in seconds (0.01–600)'
        type: string
        default: '60'
        required: true
      events_per_second:
        description: 'Events/s per agent (1–100000; max = unlimited)'
        type: string
        default: '10'
        required: true
      payload_bytes:
        description: 'Event payload bytes (8–1024)'
        type: string
        default: '256'
        required: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  diagnostic:
    name: Event publication and delivery
    runs-on: ubuntu-24.04
    timeout-minutes: 130
    env:
      AGENTS: ${{ inputs.agents }}
      DURATION: ${{ inputs.duration_seconds }}
      RATE: ${{ inputs.events_per_second }}
      PAYLOAD: ${{ inputs.payload_bytes }}
      CARGO_BUILD_JOBS: '2'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      - name: Validate inputs before building
        run: |
          mkdir -p artifacts/duration-benchmark
          printf 'BENCHMARK_OUTPUT=%s/duration-benchmark\nTMPDIR=%s\n' "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
          bash tools/duration-benchmark/ci-run.sh validate

      - name: Install repository Rust toolchain
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          version: 2026.4.28
          cache: false
          install_args: rust

      - name: Install Rust formatting component
        run: rustup component add rustfmt

      - name: Cache Cargo downloads and build outputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            tools/duration-benchmark/target
          key: duration-native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', '**/Cargo.lock', '**/Cargo.toml') }}-${{ github.sha }}
          restore-keys: |
            duration-native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', '**/Cargo.lock', '**/Cargo.toml') }}-

      - name: Check benchmark source and formatting
        timeout-minutes: 15
        run: |
          {
            git rev-parse HEAD
            uname -r
            rustc --version
            python3 --version
            cargo fmt --manifest-path tools/duration-benchmark/Cargo.toml -- --check
          } 2>&1 | tee artifacts/duration-benchmark/preflight.log

      - name: Build release agents and benchmark generator
        timeout-minutes: 30
        run: |
          {
            cargo build --release --locked -p aster-agent \
              --features client,acceptance-test-provider --bin aster-agent-acceptance-fixture \
              -p aster-node --bin aster
            cargo build --release --locked --manifest-path tools/duration-benchmark/Cargo.toml
          } 2>&1 | tee artifacts/duration-benchmark/build.log

      - name: Run publication and delivery benchmark
        run: |
          bash tools/duration-benchmark/ci-run.sh run \
            2>&1 | tee artifacts/duration-benchmark/controller.log

      - name: Show benchmark results
        if: ${{ always() }}
        run: |
          if [[ -f "$BENCHMARK_OUTPUT/summary.md" ]]; then
            cat "$BENCHMARK_OUTPUT/summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            printf '%s\n' 'Benchmark summary unavailable. Check preflight, build and controller logs.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload public reports and workflow logs
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aster-duration-benchmark-${{ github.sha }}-${{ github.run_attempt }}
          # No recursive output upload: private/ includes tokens, missions, state
          # and raw process logs. Journals and source-snapshot/ stay local too.
          path: |
            artifacts/duration-benchmark/preflight.log
            artifacts/duration-benchmark/build.log
            artifacts/duration-benchmark/controller.log
            ${{ runner.temp }}/duration-benchmark/measurement.json
            ${{ runner.temp }}/duration-benchmark/controller.json
            ${{ runner.temp }}/duration-benchmark/summary.json
            ${{ runner.temp }}/duration-benchmark/summary.md
            ${{ runner.temp }}/duration-benchmark/report.html
            ${{ runner.temp }}/duration-benchmark/attempts.csv
            ${{ runner.temp }}/duration-benchmark/accepted-eps.csv
            ${{ runner.temp }}/duration-benchmark/delivery.csv
            ${{ runner.temp }}/duration-benchmark/resources.jsonl
            ${{ runner.temp }}/duration-benchmark/resources.csv
            ${{ runner.temp }}/duration-benchmark/provenance.json
          if-no-files-found: warn
          retention-days: 14
