name: "Diagnostic: load, scale and network faults"

on:
  workflow_dispatch:
    inputs:
      agents:
        description: 'Agent count (2..20), all-to-all peers'
        type: number
        default: 2
      events:
        description: 'Events per agent (1..10000); combined receipt/time budgets apply'
        type: number
        default: 600
      payload:
        description: 'Payload bytes per Event (1..4096)'
        type: number
        default: 1024
      rate:
        description: 'Publication rate per agent (1..100 Events/s)'
        type: number
        default: 10
      bandwidth_kbit:
        description: 'Bandwidth limit per WAN egress in kbit/s (0 = no limit; blank = profile default; integer 0..1000000)'
        type: string
        required: false
        default: ''
      profile:
        description: 'Network profile (all runs the four profiles)'
        type: choice
        options: [all, baseline, impaired, reorder, outage]
        default: all
      cpu:
        description: 'CPU cores per agent container (0 unrestricted, otherwise 0.1..64)'
        type: number
        default: 0
      memory:
        description: 'RAM MiB per agent container, no swap (0 unrestricted, otherwise 64..16384)'
        type: number
        default: 0
      deadline:
        description: 'Delivery deadline seconds after publication or outage restoration (1..600)'
        type: number
        default: 120
      storage_items:
        description: 'Store max_items per agent (4161..1000000; includes control reserves)'
        type: number
        default: 10000
      storage_mib:
        description: 'Store max_payload_bytes per agent in MiB (64..4096; includes envelope overhead)'
        type: number
        default: 64

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  diagnostic:
    name: Load, scale and network faults
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      AGENTS: ${{ inputs.agents }}
      EVENTS: ${{ inputs.events }}
      PAYLOAD: ${{ inputs.payload }}
      RATE: ${{ inputs.rate }}
      BANDWIDTH_KBIT: ${{ inputs.bandwidth_kbit }}
      PROFILE: ${{ inputs.profile }}
      CPU: ${{ inputs.cpu }}
      MEMORY: ${{ inputs.memory }}
      DEADLINE: ${{ inputs.deadline }}
      STORAGE_ITEMS: ${{ inputs.storage_items }}
      STORAGE_MIB: ${{ inputs.storage_mib }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      - name: Validate diagnostic contracts and record environment
        id: preflight
        run: |
          mkdir -p artifacts/path-diagnostic
          {
            git rev-parse HEAD &&
            uname -r &&
            docker version &&
            python3 --version &&
            python3 tools/test_aster_path_diagnostic.py &&
            python3 tools/test_aster_path_delivery.py &&
            python3 tools/test_aster_path_summary.py &&
            PYTHONPATH=tools python3 -c 'import os; from aster_path_diagnostic import parse_config; keys={"AGENTS":"agents","EVENTS":"events-per-agent","PAYLOAD":"payload-bytes","RATE":"events-per-second","CPU":"cpu-limit","MEMORY":"memory-mib","DEADLINE":"restore-deadline-seconds","STORAGE_ITEMS":"storage-max-items","STORAGE_MIB":"storage-mib"}; parse_config(["--output","unused"] + [v for k,flag in keys.items() for v in ("--"+flag,os.environ[k])] + (["--bandwidth-kbit",os.environ["BANDWIDTH_KBIT"]] if os.environ["BANDWIDTH_KBIT"] != "" else []) + ["--profiles"] + (["baseline","impaired","reorder","outage"] if os.environ["PROFILE"] == "all" else [os.environ["PROFILE"]]))'
          } 2>&1 | tee artifacts/path-diagnostic/preflight.log

      - name: Set up diagnostic BuildKit builder
        # Pin source: https://github.com/docker/setup-buildx-action/releases/tag/v4.4.1
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        timeout-minutes: 3
        with:
          driver: docker-container
          use: true
          cache-binary: false
          # No insecure or host-network entitlements are needed by this image.
          buildkitd-flags: --debug

      - name: Expose GitHub cache runtime for the bounded build command
        # Docker-documented helper for inline buildx; never print env in a run step.
        # https://docs.docker.com/build/cache/backends/gha/#authentication
        # Pin source: https://github.com/crazy-max/ghaction-github-runtime/releases/tag/v4.0.0
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0
        timeout-minutes: 1

      - name: Build the canonical release image from this checkout
        id: build
        # Same digest-pinned Rust toolchain and Debian snapshot as the smoke.
        # No local-image fallback or TLS verification bypass.
        run: |
          set +e
          timeout --signal=TERM --kill-after=30s 30m \
            docker buildx build --load --pull=false --progress=plain \
              --cache-from type=gha,version=2,scope=aster-path-diagnostic-delivery-amd64-v1 \
              --cache-to type=gha,version=2,scope=aster-path-diagnostic-delivery-amd64-v1,mode=max \
              --file docker/path-lab/Dockerfile.delivery \
              --tag aster-path-delivery:local . \
            2>&1 | tee artifacts/path-diagnostic/build.log
          result=("${PIPESTATUS[@]}")
          printf '%s\n' "${result[0]}" > artifacts/path-diagnostic/build-exit-code
          if (( result[0] != 0 )); then exit "${result[0]}"; fi
          exit "${result[1]}"

      - name: Run selected profiles
        id: run
        # Controller deadlines and finally blocks own cleanup, including TERM.
        # Leave time before the job limit for cleanup and artifact upload.
        # Never upload the private ownership/credential directories in TMPDIR.
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          bandwidth=()
          if [[ -n "$BANDWIDTH_KBIT" ]]; then bandwidth=(--bandwidth-kbit "$BANDWIDTH_KBIT"); fi
          profiles=(baseline impaired reorder outage)
          if [[ "$PROFILE" != all ]]; then profiles=("$PROFILE"); fi
          set +e
          timeout --signal=TERM --kill-after=300s 50m \
            python3 -u tools/aster_path_diagnostic.py \
              --output artifacts/path-diagnostic "${bandwidth[@]}" \
              --agents "$AGENTS" --events-per-agent "$EVENTS" \
              --payload-bytes "$PAYLOAD" --events-per-second "$RATE" \
              --profiles "${profiles[@]}" --cpu-limit "$CPU" \
              --memory-mib "$MEMORY" --restore-deadline-seconds "$DEADLINE" \
              --storage-max-items "$STORAGE_ITEMS" --storage-mib "$STORAGE_MIB" \
            2>&1 | tee artifacts/path-diagnostic/controller.log
          result=("${PIPESTATUS[@]}")
          printf '%s\n' "${result[0]}" > artifacts/path-diagnostic/run-exit-code
          if (( result[0] != 0 )); then exit "${result[0]}"; fi
          exit "${result[1]}"

      - name: Write diagnostic Job Summary tables
        if: ${{ always() }}
        env:
          PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          RUN_OUTCOME: ${{ steps.run.outcome }}
        run: |
          python3 tools/aster_path_summary.py --input artifacts/path-diagnostic --output "$GITHUB_STEP_SUMMARY"

      - name: Retain reports and logs even after failure or timeout
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aster-path-diagnostic-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/path-diagnostic/
          if-no-files-found: error
          retention-days: 14
