[package]
name = "aster-duration-benchmark"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
aster-agent = { path = "../../crates/aster-agent", default-features = false, features = ["client"] }
connectrpc = { version = "=0.9.1", default-features = false, features = ["client", "json"] }
http = "=1.5.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tokio = { version = "=1.53.3", features = ["macros", "rt-multi-thread", "time", "sync"] }

[dev-dependencies]
tokio = { version = "=1.53.3", features = ["test-util"] }
connectrpc = { version = "=0.9.1", default-features = false, features = ["client", "server", "json"] }
futures = "=0.3.34"
hyper = { version = "=1.12.0", features = ["http2", "server"] }
hyper-util = { version = "=0.1.21", features = ["service", "tokio"] }

[patch.crates-io]
netlink-packet-core = { path = "../../third-party/netlink-packet-core-0.8.2-aster" }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "z"
strip = "symbols"
