[graph]
all-features = true
exclude-dev = false

[advisories]
ignore = [
  # Non-production age-provider pilot only. This is an unmaintained build-time
  # localization proc macro, not a reported vulnerability. ADR 0018 records
  # the exact graph, future-compiler warning, removal gate, and prohibition on
  # treating this exception as production admission.
  "RUSTSEC-2026-0173",
  # The same pilot's compile-time localization configuration parser is also
  # unmaintained. The scope checker enforces its exact version, registry source,
  # checksum, and reverse dependency graph; ADR 0018 records migration and exit.
  "RUSTSEC-2026-0374",
]

[licenses]
confidence-threshold = 0.93
allow = [
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BlueOak-1.0.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "NCSA",
  "Unicode-3.0",
  "Zlib",
]

# Stakeholder-approved exact-package deviations recorded by Decision 0028.
# CDLA-Permissive-2.0 applies to Mozilla trust-root data, and Unlicense is
# OSI-approved but remains outside the general allowlist. Version drift fails
# closed instead of extending either exception to another package or release.
[[licenses.exceptions]]
allow = ["CDLA-Permissive-2.0"]
name = "webpki-root-certs"
version = "=1.0.10"

[[licenses.exceptions]]
allow = ["CDLA-Permissive-2.0"]
name = "webpki-roots"
version = "=1.0.10"

[[licenses.exceptions]]
allow = ["Unlicense"]
name = "async_io_stream"
version = "=0.3.3"

[[licenses.exceptions]]
allow = ["Unlicense"]
name = "pharos"
version = "=0.5.3"

[[licenses.exceptions]]
allow = ["Unlicense"]
name = "ws_stream_wasm"
version = "=0.7.5"

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
