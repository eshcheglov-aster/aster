nextest-version = "0.9.145"

[profile.ci]
inherits = "default"
fail-fast = false

[profile.ci.junit]
path = "junit.xml"
report-name = "aster-rust-tests"
store-success-output = false
store-failure-output = true
report-skipped = "none"

[test-groups]
# The group covers both default real-process smokes and explicitly selected
# ignored mesh qualifications. Required CI never opts into ignored tests.
mesh-cli-process = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'package(aster-node) & binary(=mesh_cli)'
test-group = 'mesh-cli-process'
